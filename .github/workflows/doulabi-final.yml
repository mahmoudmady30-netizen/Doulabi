name: Doulabi Final Build

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Doulabi Android Build
    runs-on: ubuntu-latest

    steps:

      # ==============================
      # Checkout
      # ==============================

      - name: Checkout
        uses: actions/checkout@v4

      # ==============================
      # Java 17
      # ==============================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ==============================
      # Android SDK
      #
      # IMPORTANT:
      # packages is intentionally empty.
      # This prevents setup-android from
      # running "sdkmanager tools".
      # ==============================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      # ==============================
      # Accept licenses
      # ==============================

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true

      # ==============================
      # Install required Android SDK
      # ==============================

      - name: Install Android SDK packages
        shell: bash
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # ==============================
      # Verify SDK
      # ==============================

      - name: Verify Android environment
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          java -version
          sdkmanager --version
          adb version

      # ==============================
      # Gradle
      # ==============================

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      # ==============================
      # Gradle version
      # ==============================

      - name: Check Gradle
        run: ./gradlew --version

      # ==============================
      # Clean
      # ==============================

      - name: Clean project
        run: ./gradlew clean --stacktrace

      # ==============================
      # Unit tests
      # ==============================

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      # ==============================
      # Build APK
      # ==============================

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      # ==============================
      # Verify APK
      # ==============================

      - name: Verify APK
        shell: bash
        run: |
          echo "Generated APK:"
          find app/build/outputs/apk/debug \
            -type f \
            -name "*.apk" \
            -print

      # ==============================
      # Upload APK
      # ==============================

      - name: Upload Doulabi APK
        uses: actions/upload-artifact@v4
        with:
          name: Doulabi-Final-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      # ==============================
      # Upload test reports
      # ==============================

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Doulabi-Test-Reports
          path: |
            app/build/test-results/**
            app/build/reports/tests/**
          if-no-files-found: ignore
          retention-days: 14
